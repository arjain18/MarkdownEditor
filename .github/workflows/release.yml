name: Release

on:
  push:
    tags:
      - 'v*'   # runs when you push a tag like v1.0.0

jobs:
  release:
    runs-on: windows-latest   # use Windows runner to produce .exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore "MarkdownEditor.csproj"

      - name: Build project
        run: dotnet build "MarkdownEditor.csproj" --configuration Release

      - name: Publish single-file executable
        run: dotnet publish "MarkdownEditor.csproj" -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeAllContentForSelfExtract=true -o out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarkdownEditor-${{ github.ref_name }}
          path: out/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: out/MarkdownEditor.exe   # attach the single exe directly
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
