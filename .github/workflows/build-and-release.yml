name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # allow creating releases and uploading assets

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore "MarkdownEditor.csproj"

      - name: Build project
        run: dotnet build "MarkdownEditor.csproj" --configuration Release

      - name: Publish single-file executable
        run: dotnet publish "MarkdownEditor.csproj" -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeAllContentForSelfExtract=true -o out

      - name: Create zip package
        run: |
          cd out
          powershell Compress-Archive -Path * -DestinationPath ../MarkdownEditor.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarkdownEditor-${{ github.run_number }}
          path: MarkdownEditor.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: MarkdownEditor.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
