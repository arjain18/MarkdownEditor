name: Build

on:
  workflow_dispatch:   # manual trigger from Actions tab

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore "MarkdownEditor.csproj"   # or your .sln file

      - name: Build project
        run: dotnet build "MarkdownEditor.csproj" --configuration Release

      - name: Publish project
        run: dotnet publish "MarkdownEditor.csproj" -c Release -o out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.run_number }}   # unique name per run
          path: out/
